<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouLift · pitch em vídeo</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Londrina+Solid:wght@900&display=swap" rel="stylesheet">
<style>
  :root { --azul: #173359; --fundo: #0E1E36; --lima: #9FEF14; --gelo: #F4F6F1; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; color: var(--gelo); font-family: "Bricolage Grotesque", system-ui, sans-serif;
    background: radial-gradient(120% 90% at 50% 0%, var(--azul) 0%, var(--fundo) 70%);
    display: flex; flex-direction: column; align-items: center; padding: 28px 16px 40px;
  }
  header { width: min(1100px, 100%); display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
  h1 { font-family: "Londrina Solid", sans-serif; font-weight: 900; font-size: clamp(34px, 6vw, 58px); line-height: 1; margin: 0; letter-spacing: .5px; }
  h1 b { color: var(--lima); font-weight: 900; }
  header p { margin: 0; font-weight: 600; font-size: clamp(15px, 2.2vw, 19px); opacity: .85; }
  .quadro { width: min(1100px, 100%); aspect-ratio: 16 / 9; background: #06101f; border-radius: 22px; overflow: hidden; box-shadow: 0 24px 60px rgba(0, 0, 0, .45); display: grid; place-items: center; }
  .quadro iframe, .quadro video { width: 100%; height: 100%; border: 0; display: block; background: #000; }
  .espera { text-align: center; padding: 24px; font-weight: 600; font-size: clamp(16px, 2.4vw, 22px); opacity: .9; }
  .acoes { width: min(1100px, 100%); display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; }
  a.botao { text-decoration: none; font-weight: 800; font-size: clamp(16px, 2.3vw, 20px); padding: 15px 24px; border-radius: 14px; }
  a.lima { background: var(--lima); color: var(--fundo); }
  a.linha { color: var(--gelo); border: 2px solid rgba(244, 246, 241, .45); }
  a.botao:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  [hidden] { display: none !important; }
  footer { width: min(1100px, 100%); margin-top: 22px; font-size: 14px; opacity: .65; font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>You<b>Lift</b></h1>
  <p>Pitch em vídeo · Desafio de Inovação YouShop 2027</p>
</header>

<div class="quadro" id="quadro">
  <div class="espera" id="espera">O vídeo entra nesta página em instantes.</div>
</div>

<div class="acoes">
  <a class="botao lima" href="../">Mexer na demo</a>
  <a class="botao linha" id="yt" hidden target="_blank" rel="noopener">Abrir no YouTube</a>
</div>

<footer>A demo usa dados simulados e não tem conexão com sistemas da YouShop.</footer>

<script>
  // Preencher UM dos dois: o código do vídeo no YouTube (o que vem depois de youtu.be/) ou o arquivo ao lado desta página.
  const YOUTUBE = "";
  const ARQUIVO = "pitch-v1.mp4";
  const LEGENDA = "";

  const quadro = document.getElementById("quadro");
  if (YOUTUBE) {
    quadro.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + YOUTUBE + '?rel=0&cc_load_policy=1&hl=pt-BR" title="Pitch YouLift" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe>';
    const yt = document.getElementById("yt");
    yt.href = "https://youtu.be/" + YOUTUBE;
    yt.hidden = false;
  } else if (ARQUIVO) {
    quadro.innerHTML = '<video controls playsinline preload="metadata" poster="capa.jpg"><source src="' + ARQUIVO + '" type="video/mp4">' +
      (LEGENDA ? '<track kind="subtitles" srclang="pt-BR" label="Português" src="' + LEGENDA + '" default>' : '') + '</video>';
  }
</script>
</body>
</html>
